<main class="admin-main">
    <div class="content">
    <section class="cadastro-level" 
        appObserverVisibilty
        [threshold]="0.3"
        [class.visible]="isVisible"
        (visible)="onElementVisible($event)"
    >
        
        <form #levelForm="ngForm" (ngSubmit)="cadastrarLevel(levelForm)">
        <div class="form-groups">
            <div class="field">
                <label for="name">Name</label>
                <input [(ngModel)]="novoLevel.name" name="name" placeholder="Ex: Society">
            </div>
            
            <div class="field">
                <label for="description">Description</label>
                <input [(ngModel)]="novoLevel.description" name="description" placeholder="Ex: This level is...">
            </div>
            
            <div class="field">
                <label for="position">Position</label>
                 <input type="number" [(ngModel)]="novoLevel.position" (ngModelChange)="novoLevel.position = $event ? +$event : null" name="position" placeholder="Ex: 1">
            </div>
           
            <div class="field">
                <label for="image">Path</label>
                <input [(ngModel)]="novoLevel.image" name="image" placeholder="Ex: '/level.jpg'">
            </div>
            
            <div class="field">
                <label for="video">Vídeo URL</label>
                <input [(ngModel)]="novoLevel.video" name="video" placeholder="Ex: https://www.youtube.com">
            </div>
            
            <button type="submit" >cadastrar Level</button>
        </div>
        
        </form>
    </section>
    
    <section class="levels">
         @for(level of levels(); track level.id){
            <article class="level-card">
                <a [href]="level.video">
                    <img [src]="level.image" alt="">
                </a>
                <div class="info">
                    <h1>{{level.position}} - {{level.name}}</h1>
                    <span>id: {{level.id}}</span>
                </div>
                <div class="util">
                    <p>{{level.description}}</p>
                <button (click)="this.excluirLevel(level.id)">Deletar</button>
                </div>
                
            </article>
        }@empty{
            <h1>Nenhum level encontrado... </h1>
        }
    </section>
   
    </div> 
</main>
